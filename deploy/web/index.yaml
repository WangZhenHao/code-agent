# deploy/web — Next.js 用户端
apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-agent-web
  labels:
    app.kubernetes.io/name: code-agent-web
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: code-agent-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: code-agent-web
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: code-agent/web:latest
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: code-agent-web
  labels:
    app.kubernetes.io/name: code-agent-web
spec:
  selector:
    app.kubernetes.io/name: code-agent-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: code-agent-web
  annotations:
    # SSE 必须关掉缓冲，否则 token 会被攒成一坨再吐出来
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  rules:
    - host: code-agent.local
      http:
        paths:
          # 浏览器直接请求 FastAPI，避免让 Next.js 代理鉴权接口。
          - path: /user
            pathType: Prefix
            backend:
              service:
                name: code-agent-api
                port:
                  number: 8000
          - path: /chat
            pathType: Prefix
            backend:
              service:
                name: code-agent-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: code-agent-web
                port:
                  number: 80
