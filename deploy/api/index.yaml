# deploy/api — FastAPI + LangGraph 后端
apiVersion: v1
kind: ServiceAccount
metadata:
  name: code-agent-api
  # 该 SA 需要 create/delete Pod 的权限，用于按会话拉起沙箱
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-agent-api
  labels:
    app.kubernetes.io/name: code-agent-api
    app.kubernetes.io/component: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/name: code-agent-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: code-agent-api
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: code-agent-api
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: code-agent/api:latest
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: code-agent-secrets, key: database-url }
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: { name: code-agent-secrets, key: anthropic-api-key }
            - name: SANDBOX_NAMESPACE
              value: code-agent-sandboxes
            - name: SANDBOX_PROVIDER
              value: kubernetes
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
---
apiVersion: v1
kind: Service
metadata:
  name: code-agent-api
spec:
  selector:
    app.kubernetes.io/name: code-agent-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
# 只给自己 namespace 里的沙箱 Pod 发权限
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: code-agent-sandbox-manager
  namespace: code-agent-sandboxes
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, pods/exec]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [configmaps, secrets]
    verbs: [get, list]
