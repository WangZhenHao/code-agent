# 通配 Ingress：把 `<沙箱ID>.<域名>` 映射到对应沙箱。
#
# 为什么这样设计（而不是给每个沙箱建一个 Ingress）：
#   agent-sandbox 的 router 是**无状态**的，靠请求头 `X-Sandbox-ID` 决定转发给哪个沙箱。
#   所以只需**一条通配规则**覆盖所有沙箱：从 Host 里剥出子域名当沙箱 ID，塞进头里。
#   新沙箱创建后无需任何额外配置，域名立刻可用。
#
# 域名用 *.192.168.107.2.sslip.io：sslip.io 把 IP 直接编码在域名里，解析到对应 IP，
# 不需要改 hosts，也不依赖 OrbStack 的 magic DNS。192.168.107.2 是 kind 节点的地址，
# 该节点的 80 端口由 ingress-nginx（NodePort 30889，kube-proxy 同时监听 80）接住。
#
# 不用 *.localtest.me 的原因：它解析到 127.0.0.1，而本机 80 端口没有映射进 kind
# （kind 只映射了 127.0.0.1:65215→6443），请求打不到 ingress。
#
# 端口：子域名只编码了 ID，编码不了端口，所以固定转发到 3000（沙箱里的 Next dev server）。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sandbox-wildcard
  namespace: agent-sandbox-system
  annotations:
    nginx.ingress.kubernetes.io/configuration-snippet: |
      # 从 Host 剥出沙箱 ID（子域名部分）。host 通配已限定域名，这里再兜一层。
      set $sandbox_id "";
      if ($host ~ "^([a-z0-9][a-z0-9-]*)\.192\.168\.107\.2\.sslip\.io$") {
        set $sandbox_id $1;
      }
      # router 靠这三个头定位沙箱目标。端口固定 3000（Next dev server）。
      proxy_set_header X-Sandbox-ID $sandbox_id;
      proxy_set_header X-Sandbox-Namespace "default";
      proxy_set_header X-Sandbox-Port "3000";
    # Next dev server 的 HMR 用 WebSocket；静态资源路径是绝对的（/_next/...），
    # 通配子域名下根路径即 app 根，因此不需要 basePath。
spec:
  ingressClassName: nginx
  rules:
    - host: "*.192.168.107.2.sslip.io"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sandbox-router-svc
                port:
                  number: 8080
