# deploy/admin — React SPA 管理台（静态资源 + nginx）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-agent-admin
  labels:
    app.kubernetes.io/name: code-agent-admin
    app.kubernetes.io/component: admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: code-agent-admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: code-agent-admin
        app.kubernetes.io/component: admin
    spec:
      containers:
        - name: admin
          image: code-agent/admin:latest
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
      volumes:
        - name: nginx-conf
          configMap:
            name: code-agent-admin-nginx
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: code-agent-admin-nginx
data:
  default.conf: |
    server {
      listen 80;
      root /usr/share/nginx/html;
      location / {
        try_files $uri $uri/ /index.html;   # SPA history 路由
      }
      location /api/ {
        proxy_pass http://code-agent-api:8000/;
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: code-agent-admin
spec:
  selector:
    app.kubernetes.io/name: code-agent-admin
  ports:
    - name: http
      port: 80
      targetPort: http
