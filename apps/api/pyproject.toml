[project]
name = "code-agent-api"
version = "0.1.0"
description = "code-agent 后端：FastAPI + LangGraph，SSE 流式输出"
readme = "README.md"
authors = [
    { name = "Poet", email = "zhenhaowang@dimleap.ai" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "greenlet>=3.5.6",
    "langchain>=1.4.2",
    "langgraph>=1.2.12",
    "pyjwt>=2.15.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.54",
]

[project.scripts]
code-agent-api = "app.main:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = "src"
