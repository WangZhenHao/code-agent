# 本地开发依赖：PostgreSQL（LangGraph checkpointer）+ Redis（会话/缓存）
#
# 所有值都从 .env 读取，本文件不写死任何账号密码端口。
# 首次使用：cp .env.example .env
#
# 注意宿主机端口默认是 5433 / 6380，不是标准的 5432 / 6379——
# 避免和机器上其他项目的 postgres / redis 撞端口。
# 容器内仍是标准端口，服务间用服务名互连，不受影响。

services:
  postgres:
    image: postgres:16-alpine
    container_name: code-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # 显式指定，避免不同宿主机 locale 导致的排序差异
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # 用 $$ 转义，避免 compose 把它当变量插值
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: code-agent-redis
    restart: unless-stopped
    # 带密码启动；requirepass 的值同样来自 .env
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    environment:
      # 用环境变量传密码，避免出现在 docker inspect / ps 的命令行里
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
  redis-data:
