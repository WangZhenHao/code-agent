name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            apps/web/pnpm-lock.yaml
            apps/admin/pnpm-lock.yaml

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      # 与 make install 等价，但用 --frozen-lockfile / --locked 防止 lockfile 漂移
      - name: Install dependencies
        run: |
          cd apps/web && pnpm install --frozen-lockfile
          cd ../admin && pnpm install --frozen-lockfile
          cd ../api && uv sync --locked

      # 各 app 的 .env 只在本地存在且被 gitignore，CI 上统一用仓库里的示例值兜底。
      # api 是硬需求：app.settings 在导入时就实例化 Settings()，必填字段缺失会让
      # 测试在 import 阶段直接抛 ValidationError。
      # web 的变量代码里有默认值兜底，复制与否行为一致，这里只是为了和本地对齐。
      # admin 没有 .env.example（VITE_API_BASE_URL 没被实际读取），无需处理。
      - name: Prepare env file
        run: |
          cp apps/api/.env.example apps/api/.env
          cp apps/web/.env.example apps/web/.env

      - name: fmt-check
        run: make fmt-check

      - name: test
        run: make test

      - name: build
        run: make build
