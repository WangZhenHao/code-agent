name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            apps/web/pnpm-lock.yaml
            apps/admin/pnpm-lock.yaml

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      # 与 make install 等价，但用 --frozen-lockfile / --locked 防止 lockfile 漂移
      - name: Install dependencies
        run: |
          cd apps/web && pnpm install --frozen-lockfile
          cd ../admin && pnpm install --frozen-lockfile
          cd ../api && uv sync --locked

      - name: fmt-check
        run: make fmt-check

      - name: test
        run: make test

      - name: build
        run: make build
